meta:
  name: graduation_v2_single_robot_visual_demo
  model_version: sequence_arc_v2
  description: R2-only known-map visual gate; formal experiments continue to use planner_graduation_v2.yaml.
  event_task_policy:
    supply_location: S
    observe: {duration: 5.0, deadline_offset: 60.0, priority_weight: 6.0}
    verify: {duration: 5.0, deadline_offset: 90.0, priority_weight: 10.0}
    pickup: {duration: 5.0, deadline_offset: 120.0, priority_weight: 8.0}
    deliver: {duration: 5.0, deadline_offset: 180.0, priority_weight: 8.0}
    location_resources:
      B: [event_zone_B]
    supply_resources: [supply_point_S]

weights:
  alpha_travel: 1.0
  beta_delay: 4.0
  gamma_interrupt: 2.0
  delta_resource: 1.5
  eta_energy: 3.0
  mu_change: 2.5

solver: {time_limit: 5.0, mip_gap: 0.01, planning_horizon: 300.0}

energy:
  safe_battery: 20.0
  full_battery: 90.0
  move_cost_per_sec: 0.3
  task_costs:
    patrol: 2.0
    observe: 2.5
    verify_fall: 3.0
    pickup_supply: 2.0
    deliver_supply: 5.0
    charge: 0.0
  charge_gain: {}

robots:
  - id: R2
    start: A
    battery: 90.0
    capabilities: [move, camera, patrol, carry]
    current_task: null

tasks: []

precedence: []

resources:
  - {id: corridor_H, kind: corridor, capacity: 1, state: free, release_buffer: 0}
  - {id: event_zone_B, kind: event_zone, capacity: 1, state: available, release_buffer: 0}
  - {id: supply_point_S, kind: supply_point, capacity: 1, state: available, release_buffer: 0}

travel_times:
  A: {A: 0, B: 18, C: 25, D: 30, S: 22}
  B: {A: 18, B: 0, C: 20, D: 28, S: 12}
  C: {A: 25, B: 20, C: 0, D: 16, S: 24}
  D: {A: 30, B: 28, C: 16, D: 0, S: 20}
  S: {A: 22, B: 12, C: 24, D: 20, S: 0}

route_resources:
  A:
    B: [{resource_id: corridor_H, enter_fraction: 0.25, exit_fraction: 0.75, safety_buffer: 1.0}]
    C: [{resource_id: corridor_H, enter_fraction: 0.20, exit_fraction: 0.80, safety_buffer: 1.0}]
  B:
    A: [{resource_id: corridor_H, enter_fraction: 0.25, exit_fraction: 0.75, safety_buffer: 1.0}]
    C: [{resource_id: corridor_H, enter_fraction: 0.15, exit_fraction: 0.85, safety_buffer: 1.0}]
    S: [{resource_id: corridor_H, enter_fraction: 0.20, exit_fraction: 0.80, safety_buffer: 1.0}]
  C:
    A: [{resource_id: corridor_H, enter_fraction: 0.20, exit_fraction: 0.80, safety_buffer: 1.0}]
    B: [{resource_id: corridor_H, enter_fraction: 0.15, exit_fraction: 0.85, safety_buffer: 1.0}]
    S: [{resource_id: corridor_H, enter_fraction: 0.20, exit_fraction: 0.80, safety_buffer: 1.0}]
  S:
    B: [{resource_id: corridor_H, enter_fraction: 0.20, exit_fraction: 0.80, safety_buffer: 1.0}]
    C: [{resource_id: corridor_H, enter_fraction: 0.20, exit_fraction: 0.80, safety_buffer: 1.0}]

semantic:
  theta_low: 0.45
  theta_high: 0.75
  quality_min: 0.55
  min_confirm_windows: 2
  min_clear_windows: 2
  hold_frames: 3
  cooldown_frames: 2
  visible_keypoint_threshold: 6

spatial:
  occupancy_threshold_free: 0.25
  occupancy_threshold_blocked: 0.65
  min_passage_width: 0.7
  ema_lambda: 0.6

dynamic_script: []
