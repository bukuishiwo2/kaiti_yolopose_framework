meta:
  description: Task-relevant planning regions for costmap-to-resource abstraction.

regions:
  - id: corridor_H
    kind: corridor
    resource_id: corridor_H
    bounds:
      x_min: 1.0
      x_max: 2.4
      y_min: 1.0
      y_max: 3.0
    width_axis: x
    min_passage_width: 0.8
    free_threshold: 0.25
    blocked_threshold: 0.65
    temporary_wait_sec: 20.0
    blocked_wait_sec: 60.0
    occupied_value_threshold: 50
    unknown_as_occupied: true

  - id: charger_D
    kind: charger
    resource_id: charger_D
    bounds:
      x_min: 5.0
      x_max: 6.0
      y_min: 0.5
      y_max: 1.5
    width_axis: x
    min_passage_width: 0.6
    free_threshold: 0.30
    blocked_threshold: 0.75
    temporary_wait_sec: 10.0
    blocked_wait_sec: 40.0
    occupied_value_threshold: 50
    unknown_as_occupied: true

  - id: event_zone_B
    kind: region
    resource_id: event_zone_B
    bounds:
      x_min: 3.0
      x_max: 4.0
      y_min: 3.0
      y_max: 4.0
    width_axis: y
    min_passage_width: 0.6
    free_threshold: 0.30
    blocked_threshold: 0.75
    temporary_wait_sec: 10.0
    blocked_wait_sec: 40.0
    occupied_value_threshold: 50
    unknown_as_occupied: true

  - id: supply_point_S
    kind: region
    resource_id: supply_point_S
    bounds:
      x_min: 0.5
      x_max: 1.5
      y_min: 4.0
      y_max: 5.0
    width_axis: y
    min_passage_width: 0.6
    free_threshold: 0.30
    blocked_threshold: 0.75
    temporary_wait_sec: 10.0
    blocked_wait_sec: 40.0
    occupied_value_threshold: 50
    unknown_as_occupied: true
