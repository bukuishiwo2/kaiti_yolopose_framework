semantic_state_node:
  ros__parameters:
    use_sim_time: true
    planner_config_path: configs/planner_graduation_v2.yaml
    perception_event_topic: /perception/events
    semantic_state_topic: /planning/semantic_state
    publish_period_sec: 1.0
    perception_timeout_sec: 3.0

spatial_state_node:
  ros__parameters:
    use_sim_time: true
    planner_config_path: configs/planner_graduation_v2.yaml
    region_config_path: configs/planner_regions_house.yaml
    spatial_state_topic: /planning/spatial_state
    map_topic: /map
    robot_pose_topic: /amcl_pose
    publish_period_sec: 1.0
    costmap_topic: /global_costmap/costmap
    costmap_timeout_sec: 5.0
    use_costmap_topic: true
    costmap_baseline_samples: 5
    self_footprint_clear_radius: 0.60

milp_planner_node:
  ros__parameters:
    use_sim_time: true
    planner_config_path: configs/planner_graduation_v2.yaml
    semantic_state_topic: /planning/semantic_state
    spatial_state_topic: /planning/spatial_state
    execution_feedback_topic: /planning/execution_feedback
    plan_topic: /planning/plan
    health_topic: /planning/planner_health
    solve_debounce_sec: 0.25
    health_period_sec: 2.0
    plan_valid_sec: 600.0
    plan_id: house-v2
    # Empty in the formal stack: a Nav2 arrival is not a verification result.
    # The visual-only launch may override this with "fall" to demonstrate the
    # verify -> pickup -> deliver episode without a physical verify performer.
    verification_result_on_success: ""
    backend: pulp

milp_plan_executor_node:
  ros__parameters:
    use_sim_time: true
    planner_config_path: configs/planner_graduation_v2.yaml
    waypoint_config_path: configs/planner_waypoints.yaml
    plan_topic: /planning/plan
    planner_status_topic: /planning/executor_status
    nav2_action_name: /navigate_to_pose
    map_topic: /map
    controlled_robot_id: R2
    execution_enabled: false
    allow_plan_refresh_during_execution: false
    require_tf_ready: true
    require_waypoint_in_map: true
    waypoint_map_margin_m: 0.10
    base_frame_id: base_link
    tf_wait_timeout_sec: 0.2
    publish_period_sec: 1.0
    task_hold_sec: 1.0
    plan_stale_sec: 600.0
    max_nav_retries_per_step: 0

execution_feedback_bridge_node:
  ros__parameters:
    use_sim_time: true
    planner_status_topic: /planning/executor_status
    execution_feedback_topic: /planning/execution_feedback
    publish_period_sec: 1.0
    status_timeout_sec: 5.0
