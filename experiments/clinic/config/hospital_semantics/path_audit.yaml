map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /home/yhc/clinic_planning_ws/verification/hospital_semantics/nav2_masks/base.yaml
    frame_id: map
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.05
      use_astar: true
      allow_unknown: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: audit_base
      update_frequency: 2.0
      publish_frequency: 2.0
      resolution: 0.05
      robot_radius: 0.001
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: [static_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        enabled: true
